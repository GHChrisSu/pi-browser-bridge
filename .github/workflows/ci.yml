name: Pi Browser Bridge CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run package:extension
      - uses: actions/upload-artifact@v4
        with:
          name: pi-browser-bridge-chrome-extension
          path: dist/pi-browser-bridge-extension.zip
